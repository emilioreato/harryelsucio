<svg xmlns="http://www.w3.org/2000/svg">
  <filter id="glass-lens" x="-12%" y="-12%" width="124%" height="124%" color-interpolation-filters="sRGB">
    <feTurbulence
      type="fractalNoise"
      baseFrequency="0.008 0.013"
      numOctaves="1"
      seed="19"
      stitchTiles="stitch"
      result="soft-waves"
    />
    <feGaussianBlur in="soft-waves" stdDeviation="1.2" result="lens-map" />
    <feDisplacementMap
      in="SourceGraphic"
      in2="lens-map"
      scale="12"
      xChannelSelector="R"
      yChannelSelector="G"
    />
  </filter>
</svg>
