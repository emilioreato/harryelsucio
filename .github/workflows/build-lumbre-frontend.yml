name: Build Lumbre frontend

on:
  push:
    branches:
      - "main"
    paths:
      - "frontend/**"
      - ".github/workflows/build-lumbre-frontend.yml"

permissions:
  contents: write

concurrency:
  group: lumbre-frontend-build
  cancel-in-progress: true

jobs:
  build-frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check Python syntax
        run: python -m compileall -q app.py pyroscope
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Build static web bundle
        working-directory: frontend
        run: npm run build
      - name: Commit generated assets when changed
        shell: bash
        run: |
          git add web
          if git diff --cached --quiet; then
            echo "The generated web bundle is already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+actions@users.noreply.github.com"
          git commit -m "Build Lumbre frontend bundle [skip ci]"
          git push
