name: Build Lumbre frontend

on:
  push:
    branches:
      - "main"
    paths:
      - "frontend/**"
      - ".github/workflows/build-lumbre-frontend.yml"

permissions:
  contents: read

concurrency:
  group: lumbre-frontend-build
  cancel-in-progress: true

jobs:
  build-frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check Python syntax
        run: python -m compileall -q lumbre
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Build static web bundle
        working-directory: frontend
        run: npm run build
      - name: Verify generated web bundle
        shell: bash
        run: |
          if ! git diff --quiet --ignore-space-at-eol -- web; then
            echo "::error::El bundle de web/ no coincide con el frontend. Ejecuta npm run build y confirma los artefactos generados."
            git diff --stat -- web
            exit 1
          fi
          if [[ -n "$(git ls-files --others --exclude-standard -- web)" ]]; then
            echo "::error::El build generó archivos nuevos en web/ que todavía no están confirmados."
            git ls-files --others --exclude-standard -- web
            exit 1
          fi
