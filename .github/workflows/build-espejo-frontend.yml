name: Build Espejo Ustorio frontend

on:
  push:
    branches:
      - "redesign/espejo-ustorio"
    paths:
      - "frontend/**"
      - ".github/workflows/build-espejo-frontend.yml"

permissions:
  contents: write

jobs:
  build-frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Build static web bundle
        working-directory: frontend
        run: npm run build
      - name: Commit generated web assets when changed
        shell: bash
        run: |
          git add web
          if git diff --cached --quiet; then
            echo "The generated web bundle is already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Build frontend bundle [skip ci]"
          git push
